[project]
name = "aigo-tools"
version = "1.0.0"
description = "AgentOps MCP Gateway Tools — all 9 tool groups"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pygithub>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
