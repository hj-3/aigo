[project]
name = "common"
version = "1.0.0"
description = "Shared Python utilities for AgentOps Platform"
requires-python = ">=3.12"
dependencies = [
  "ulid-py>=2.2.0",
  "structlog>=24.4.0",
  "python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
