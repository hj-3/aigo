[project]
name = "finding-schema"
version = "1.0.0"
description = "Canonical Pydantic schemas for AgentOps findings and reports"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finding_schema"]
