[project]
name = "aws-utils"
version = "1.0.0"
description = "Shared boto3 helpers for AgentOps Platform"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_utils"]
