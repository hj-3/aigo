name: CD — Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy (all | infra | agents | api | dashboard)'
        required: true
        default: 'all'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: "1.9.8"
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Infrastructure (Terraform apply)
  # ──────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: ${{ inputs.component == 'all' || inputs.component == 'infra' || github.event_name == 'push' }}
    environment: production
    outputs:
      api_function_name: ${{ steps.tf-outputs.outputs.api_function_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: infra/terraform/envs/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/terraform/envs/prod
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_github_org: ${{ secrets.GH_ORG }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

  # ──────────────────────────────────────────────────────
  # 2. Lambda Functions (connectors + workers + API)
  # ──────────────────────────────────────────────────────
  deploy-api:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: connector-github, function: aigo-connector-github }
          - { name: connector-slack, function: aigo-connector-slack }
          - { name: connector-aws-event, function: aigo-connector-aws-event }
          - { name: connector-dashboard-cmd, function: aigo-connector-dashboard-cmd }
          - { name: worker-lightweight, function: aigo-worker-lightweight }
          - { name: dashboard-api, function: aigo-dashboard-api }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4

      - name: Install and bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -F "@aigo/${{ matrix.package.name }}" bundle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy Lambda
        run: bash scripts/deploy-lambda.sh ${{ matrix.package.name }} ${{ matrix.package.function }}

  # ──────────────────────────────────────────────────────
  # 3. Heavy Worker Docker Image
  # ──────────────────────────────────────────────────────
  deploy-heavy-worker:
    name: Deploy Heavy Worker (ECS)
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workers/heavy
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/aigo-worker-heavy:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/aigo-worker-heavy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition aigo-heavy-worker \
            --query taskDefinition > task-def.json

          # Update image tag in task definition
          cat task-def.json | \
            jq '.containerDefinitions[0].image = "${{ env.ECR_REGISTRY }}/aigo-worker-heavy:${{ github.sha }}"' \
            > new-task-def.json

          aws ecs register-task-definition --cli-input-json file://new-task-def.json

  # ──────────────────────────────────────────────────────
  # 4. Dashboard (S3 + CloudFront invalidation)
  # ──────────────────────────────────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard (S3)
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -F "@aigo/dashboard" build
        env:
          VITE_API_URL: ${{ secrets.API_GATEWAY_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/dashboard/dist/ s3://${{ secrets.DASHBOARD_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "*.html"

          aws s3 sync apps/dashboard/dist/ s3://${{ secrets.DASHBOARD_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
