name: CD — Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy (all | infra | api | dashboard)'
        required: false
        default: 'all'

permissions:
  id-token: write
  contents: read

# Prevent concurrent Terraform runs — queue new runs, never cancel in progress.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: "1.10.3"
  TF_STATE_BUCKET: aigo-tf-state
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  # ──────────────────────────────────────────────────────
  # 0. Detect changed components
  # ──────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      infra:     ${{ steps.diff.outputs.infra }}
      api:       ${{ steps.diff.outputs.api }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed components
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMP="${{ inputs.component }}"
            echo "infra=$(    [[ "$COMP" == "all" || "$COMP" == "infra"     ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "api=$(      [[ "$COMP" == "all" || "$COMP" == "api"       ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "dashboard=$(  [[ "$COMP" == "all" || "$COMP" == "dashboard" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$FILES"
            grep -qE "^infra/"                                                          <<< "$FILES" && echo "infra=true"     >> "$GITHUB_OUTPUT" || echo "infra=false"     >> "$GITHUB_OUTPUT"
            grep -qE "^(connectors|workers/lightweight|apps/dashboard-api|packages)/"  <<< "$FILES" && echo "api=true"       >> "$GITHUB_OUTPUT" || echo "api=false"       >> "$GITHUB_OUTPUT"
            grep -qE "^(apps/dashboard|packages)/"                                     <<< "$FILES" && echo "dashboard=true" >> "$GITHUB_OUTPUT" || echo "dashboard=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────
  # 1. Infrastructure (Terraform apply)
  # ──────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    environment: production
    outputs:
      cognito_user_pool_id: ${{ steps.tf-outputs.outputs.cognito_user_pool_id }}
      cognito_client_id:    ${{ steps.tf-outputs.outputs.cognito_client_id }}
      cognito_domain:       ${{ steps.tf-outputs.outputs.cognito_domain }}
      cloudfront_domain:    ${{ steps.tf-outputs.outputs.cloudfront_domain }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Terraform Init (global/iam)
        working-directory: infra/terraform/global/iam
        run: terraform init -reconfigure

      - name: Clear stale lock (global/iam)
        working-directory: infra/terraform/global/iam
        run: |
          LOCK_KEY="global/iam/terraform.tfstate.tflock"
          if aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/${LOCK_KEY}" /tmp/iam.lock 2>/dev/null; then
            LOCK_ID=$(jq -r '.ID' /tmp/iam.lock)
            echo "Lock found: ${LOCK_ID} — force-unlocking (safe: concurrency group prevents parallel runs)"
            terraform force-unlock -force "${LOCK_ID}"
          else
            echo "No lock file — proceeding"
          fi

      - name: Terraform Apply (global/iam)
        working-directory: infra/terraform/global/iam
        run: terraform apply -auto-approve -no-color -lock-timeout=5m
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project: aigo
          TF_VAR_github_org: ${{ secrets.GH_ORG }}

      - name: Terraform Init
        working-directory: infra/terraform/envs/prod
        run: terraform init -reconfigure

      - name: Clear stale lock (envs/prod)
        working-directory: infra/terraform/envs/prod
        run: |
          LOCK_KEY="prod/terraform.tfstate.tflock"
          if aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/${LOCK_KEY}" /tmp/prod.lock 2>/dev/null; then
            LOCK_ID=$(jq -r '.ID' /tmp/prod.lock)
            echo "Lock found: ${LOCK_ID} — force-unlocking (safe: concurrency group prevents parallel runs)"
            terraform force-unlock -force "${LOCK_ID}"
          else
            echo "No lock file — proceeding"
          fi

      - name: Terraform Apply
        working-directory: infra/terraform/envs/prod
        run: terraform apply -auto-approve -no-color -lock-timeout=5m
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_github_org: ${{ secrets.GH_ORG }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

      - name: Read Terraform outputs
        id: tf-outputs
        working-directory: infra/terraform/envs/prod
        run: |
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)"       >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(terraform output -raw cognito_domain)"             >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain)"       >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────
  # 2. Lambda Functions (connectors + workers + API)
  # ──────────────────────────────────────────────────────
  deploy-api:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-infra]
    if: |
      always() && !cancelled() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      needs.detect-changes.outputs.api == 'true'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: connector-github, function: aigo-github-connector }
          - { name: connector-slack, function: aigo-slack-connector }
          - { name: connector-aws-event, function: aigo-aws-event-connector }
          - { name: connector-dashboard-cmd, function: aigo-dashboard-cmd-connector }
          - { name: worker-lightweight, function: aigo-lightweight-worker }
          - { name: dashboard-api, function: aigo-dashboard-api }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter="{packages/**}" build

      - name: Bundle
        run: pnpm -F "@aigo/${{ matrix.package.name }}" bundle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy Lambda
        run: bash scripts/deploy-lambda.sh ${{ matrix.package.name }} ${{ matrix.package.function }}

  # ──────────────────────────────────────────────────────
  # 3. Heavy Worker Docker Image
  # ──────────────────────────────────────────────────────
  deploy-heavy-worker:
    name: Deploy Heavy Worker (ECS)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-infra]
    if: |
      always() && !cancelled() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      needs.detect-changes.outputs.api == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workers/heavy
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/aigo-worker-heavy:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/aigo-worker-heavy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ECS task definition
        run: |
          # Strip read-only fields that register-task-definition does not accept
          aws ecs describe-task-definition \
            --task-definition aigo-heavy-worker \
            --query taskDefinition \
            --output json \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
                  | .containerDefinitions[0].image = "${{ env.ECR_REGISTRY }}/aigo-worker-heavy:${{ github.sha }}"' \
            > new-task-def.json

          aws ecs register-task-definition --cli-input-json file://new-task-def.json

  # ──────────────────────────────────────────────────────
  # 4. Dashboard (S3 + CloudFront invalidation)
  # ──────────────────────────────────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard (S3)
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-infra]
    if: |
      always() && !cancelled() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      needs.detect-changes.outputs.dashboard == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Read Terraform outputs
        id: tf-out
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -reconfigure -input=false
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)"       >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(terraform output -raw cognito_domain)"             >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain)"       >> "$GITHUB_OUTPUT"

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -F "@aigo/dashboard" build
        env:
          VITE_API_URL:               ${{ secrets.API_GATEWAY_URL }}
          VITE_COGNITO_USER_POOL_ID:  ${{ steps.tf-out.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID:     ${{ steps.tf-out.outputs.cognito_client_id }}
          VITE_COGNITO_DOMAIN:        ${{ steps.tf-out.outputs.cognito_domain }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/dashboard/dist/ s3://${{ secrets.DASHBOARD_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "*.html"

          aws s3 sync apps/dashboard/dist/ s3://${{ secrets.DASHBOARD_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
