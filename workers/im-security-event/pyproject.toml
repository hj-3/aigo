[project]
name = "worker-im-security-event"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "python-ulid>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
